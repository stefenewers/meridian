[project]
name = "meridian-simulation"
version = "0.1.0"
description = "Discrete-event fleet simulation and probabilistic demand forecasting for Meridian."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "simpy>=4.1",
  "ortools>=9.10",
  "lightgbm>=4.3",
  "scikit-learn>=1.4",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["meridian*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
