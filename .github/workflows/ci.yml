name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulation:
    name: Python simulation service
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/simulation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/simulation/requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # Split from the reproducibility test below so a failure in either is identifiable
      # from the step name alone, without opening the log.
      - name: Tests - config
        run: pytest -v tests/test_config.py

      - name: Tests - demand
        if: ${{ !cancelled() }}
        run: pytest -v tests/test_demand.py

      - name: Tests - dispatch
        if: ${{ !cancelled() }}
        run: pytest -v tests/test_dispatch.py

      - name: Tests - runner
        if: ${{ !cancelled() }}
        run: pytest -v tests/test_runner.py

      - name: Cross-process reproducibility
        if: ${{ !cancelled() }}
        # Shells out twice under different PYTHONHASHSEED values. Set-iteration
        # nondeterminism cannot be caught from inside a single process, and it is the bug
        # this test exists to prevent. It trains a demand model in each subprocess, so it
        # is the slowest thing here by a wide margin.
        run: pytest -v tests/test_reproducibility.py

  web:
    name: TypeScript frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
