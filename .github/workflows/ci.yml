name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulation:
    name: Python simulation service
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/simulation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/simulation/requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # The package itself, so `pytest` can import `meridian` without relying on
          # cwd being on sys.path. `make test` runs `python -m pytest`, which inserts
          # cwd implicitly; a bare `pytest` does not, and every test file failed to
          # collect because of it.
          pip install -e .

      - name: Lint
        run: ruff check .

      # Split from the reproducibility test below so a failure in either is identifiable
      # from the step name alone, without opening the log.
      - name: Unit tests
        run: pytest -v --durations=10 --ignore=tests/test_reproducibility.py

      # Preflight: the reproducibility test shells out, so a failure inside the
      # subprocess surfaces only as a non-zero exit. These name the cause instead.
      - name: Preflight - experiment file on disk
        if: ${{ !cancelled() }}
        run: test -f ../../experiments/late-night-airport-expansion.yaml

      - name: Preflight - EXPERIMENTS_DIR resolves
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import sys
          from meridian.library import EXPERIMENTS_DIR
          print("EXPERIMENTS_DIR:", EXPERIMENTS_DIR)
          print("exists:", EXPERIMENTS_DIR.exists())
          sys.exit(0 if EXPERIMENTS_DIR.exists() else 1)
          PY

      - name: Preflight - load the experiment
        if: ${{ !cancelled() }}
        run: python -c "from meridian.library import load_by_id; load_by_id('late-night-airport-expansion'); print('loaded')"

      - name: Cross-process reproducibility
        if: ${{ !cancelled() }}
        # Shells out twice under different PYTHONHASHSEED values. Set-iteration
        # nondeterminism cannot be caught from inside a single process, and it is the bug
        # this test exists to prevent. It trains a demand model in each subprocess, so it
        # is the slowest thing here by a wide margin.
        run: pytest -v tests/test_reproducibility.py

  web:
    name: TypeScript frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
