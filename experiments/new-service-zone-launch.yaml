id: new-service-zone-launch
title: New service-zone launch
question: >-
  Can the current fleet absorb three new zones on an event night without pushing cost per
  completed trip up more than four percent?
owner: market-expansion
config_version: 1.0.0
baseline:
  label: Current service area
  fleet: { vehicles: 220, depots: 2, chargers: 36, starting_soc: 0.70 }
  policy:
    dispatch: nearest_available
    airport_priority: false
    demand_aware_repositioning: false
    service_area_expansion: false
proposed:
  label: Three new zones
  fleet: { vehicles: 240, depots: 2, chargers: 36, starting_soc: 0.70 }
  policy:
    dispatch: demand_aware
    airport_priority: false
    demand_aware_repositioning: true
    service_area_expansion: true
demand: { percentile: p50, rain: false, event_surge: true, day_of_week: 5 }
run: { replications: 16, seed: 20260405, horizon_minutes: 360, window_start_hour: 21 }
targets:
  p50_pickup_minutes: 6.0
  p90_pickup_minutes: 8.5
  max_completion_loss_pct: 0.5
  max_charger_queue_minutes: 14.0
